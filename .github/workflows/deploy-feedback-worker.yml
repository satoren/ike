name: ご意見の中継（feedback-worker）をデプロイ

# main に中継のコードの変更が入ったら、Cloudflare Workers へデプロイする
on:
  push:
    branches: [main]
    paths:
      - 'feedback-worker/**'
      - '.github/workflows/deploy-feedback-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedback-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 中継のテストは src/feedback.test.ts にある
      - run: npm test
      # wrangler.toml の database_id は置き換え前の印のままなので、Actions 変数の値を入れる
      - name: D1 の id を入れる
        env:
          D1_ID: ${{ vars.FEEDBACK_D1_ID }}
        run: |
          if [ -z "$D1_ID" ]; then
            echo "::error::Actions 変数 FEEDBACK_D1_ID（D1 の database_id）が設定されていません"
            exit 1
          fi
          sed -i "s/REPLACE_WITH_D1_ID/$D1_ID/" feedback-worker/wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: feedback-worker
          command: deploy
