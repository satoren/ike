# ゲームとご意見の中継を 1 つの Worker で配信する（https://ike.satoren.workers.dev）
name = "ike"
main = "src/index.js"
compatibility_date = "2026-10-01"

# デプロイ（wrangler deploy / versions upload）の前に、リポジトリ直下でゲームをビルドする。
# Cloudflare の Workers Builds でも手元でも、ここに書いたビルドが必ず走る
[build]
command = "npm ci && npm run build:cloudflare"
cwd = ".."
watch_dir = "../src"

# ゲーム本体（リポジトリ直下で npm run build した dist/）を静的ファイルとして配信する。
# 管理ページ・API・投稿の受け口だけ Worker が先に受ける
[assets]
directory = "../dist"
run_worker_first = ["/api/*", "/admin", "/feedback", "/scores"]

# 毎日 15:00 UTC（日本時間 0:00）に、前の日の投稿をまとめる
[triggers]
crons = ["0 15 * * *"]

[vars]
# ゲームは同じ URL から送るので、ここはローカル開発用（vite）
ALLOWED_ORIGINS = "http://localhost:5173"
# 1年のランキングの区分。プレビュー版から届いた成績は本番のランキングに混ぜない
RANKING_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "ike-feedback"
# 本番の D1（秘密ではない。アカウントに入れないと使えない）
database_id = "127fbba3-60a2-41c6-8b8e-a6c96d952327"

# PR ごとのプレビュー版（Workers Builds）用の設定。
# 専用の D1 はまだ作っていないので、本番と同じ D1 を使う（プレビューで送ったご意見も本番の一覧に入る）
[previews.vars]
ALLOWED_ORIGINS = "http://localhost:5173"
RANKING_ENV = "preview"

[[previews.d1_databases]]
binding = "DB"
database_name = "ike-feedback"
database_id = "127fbba3-60a2-41c6-8b8e-a6c96d952327"
