name = "ike-feedback"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 毎日 15:00 UTC（日本時間 0:00）に、前の日の投稿をまとめる
[triggers]
crons = ["0 15 * * *"]

[vars]
ALLOWED_ORIGINS = "https://satoren.github.io,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "ike-feedback"
# 本番の D1（秘密ではない。アカウントに入れないと使えない）
database_id = "127fbba3-60a2-41c6-8b8e-a6c96d952327"
